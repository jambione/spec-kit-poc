schema_version: "1.0"

extension:
  id: review
  name: "Review, Attack & Fix"
  version: "0.1.0"
  description: "Post-implementation quality loop: context packs, a critic and an adversary that prove defects with failing tests, human rulings, a fixer, and a final spec-conformance audit"
  author: spec-kit-poc
  license: MIT

requires:
  speckit_version: ">=1.0.0"
  tools:
    - name: git
      required: true
    - name: python3
      required: true

provides:
  commands:
    - name: speckit.review.pack
      file: commands/speckit.review.pack.md
      description: "Write a ≤150-line context pack for one scope (user story or phase) before implementing or reviewing it"
    - name: speckit.review.code
      file: commands/speckit.review.code.md
      description: "Critic: review the implementation diff against the spec, prove each defect with a failing test, write numbered findings"
    - name: speckit.review.attack
      file: commands/speckit.review.attack.md
      description: "Adversary: try to break security- or interop-critical code with hostile inputs; failing tests are the findings"
    - name: speckit.review.rule
      file: commands/speckit.review.rule.md
      description: "Merge duplicate findings and record the developer's binding rulings on anything ambiguous"
    - name: speckit.review.fix
      file: commands/speckit.review.fix.md
      description: "Fixer: work through the findings, regression test first for BLOCKER/MAJOR, obey rulings, update each finding's status"
    - name: speckit.review.audit
      file: commands/speckit.review.audit.md
      description: "Final audit: check the whole repo against the spec and write the manual-check list"

  config:
    - name: "review-config.yml"
      template: "config-template.yml"
      description: "Gate commands, test locations, critical paths and loop limits"
      required: true

hooks:
  before_implement:
    command: speckit.review.pack
    optional: true
    prompt: "Write a context pack for the scope you are about to implement?"
    description: "Context pack before implementation"
  after_implement:
    command: speckit.review.code
    optional: true
    prompt: "Run the critic review on what was just implemented?"
    description: "Code review after implementation"

tags:
  - "review"
  - "quality"
  - "testing"
  - "security"
