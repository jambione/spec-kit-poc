name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-dlc-gates:
    name: ai-dlc-gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check spec → plan → tasks exist for code changes
        run: bash scripts/check-gates.sh "origin/${{ github.base_ref }}" "${{ github.head_ref }}"

  dotnet:
    name: dotnet-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect solution
        id: sln
        run: |
          if ls *.sln *.slnx >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No solution yet: it is created during /speckit-implement."; fi
      - uses: actions/setup-dotnet@v4
        if: steps.sln.outputs.found == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Restore
        if: steps.sln.outputs.found == 'true'
        run: dotnet restore
      - name: Build
        if: steps.sln.outputs.found == 'true'
        run: dotnet build --no-restore -c Release
      - name: Test
        if: steps.sln.outputs.found == 'true'
        run: dotnet test --no-build -c Release --logger "trx" --collect:"XPlat Code Coverage"
      - name: Format check
        if: steps.sln.outputs.found == 'true'
        run: dotnet format --verify-no-changes
